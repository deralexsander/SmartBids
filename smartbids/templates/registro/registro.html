{% extends 'smartbids/base.html' %}
{% load static %}

{% block nombrePag %}
<title>Registro</title>
{% endblock %}

{% block contenido %}
<div>
    <h2>Registro</h2>
    <form id="register-form">
        {% csrf_token %}
        <label>Correo:</label>
        <input type="email" id="email" name="email" required><br><br>
        <label>Confirmar correo:</label>
        <input type="email" id="email-confirm" name="email_confirm" required><br><br>
        <label>Contraseña:</label>
        <input type="password" id="password" name="password" required><br><br>
        <label>Confirmar contraseña:</label>
        <input type="password" id="password-confirm" name="password_confirm" required><br><br>
        <label><input type="checkbox" id="show-passwords"> Ver contraseñas</label><br><br>
        <button type="submit">Registrarse</button>
    </form>
    <p id="message"></p>
    <p><a href="{% url 'ingreso' %}">Ya tengo una cuenta</a></p>
</div>

<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getAuth, createUserWithEmailAndPassword, sendEmailVerification, signOut } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
    import { redirectIfAuthenticated } from '{% static "js/functions.js" %}';

    const firebaseConfig = {
        apiKey: 'AIzaSyBlCZkRsr39TbPnL3fse3QH-W3oMIv7384',
        authDomain: 'smartbids-e0b99.firebaseapp.com',
        projectId: 'smartbids-e0b99',
        storageBucket: 'smartbids-e0b99.firebasestorage.app',
        messagingSenderId: '958415636156',
        appId: '1:958415636156:web:3859749919a9e9573ab2b9',
        measurementId: 'G-8JED2S96M0',
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    redirectIfAuthenticated(auth, '/');
    const form = document.getElementById('register-form');
    const message = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('email').value.trim();
        const emailConfirm = document.getElementById('email-confirm').value.trim();
        const password = document.getElementById('password').value;
        const passwordConfirm = document.getElementById('password-confirm').value;

        message.textContent = '';
        message.style.color = '';

        if (email !== emailConfirm) {
            message.textContent = 'Los correos no coinciden.';
            message.style.color = 'red';
            return;
        }

        if (password !== passwordConfirm) {
            message.textContent = 'Las contraseñas no coinciden.';
            message.style.color = 'red';
            return;
        }

        if (password.length < 6) {
            message.textContent = 'La contraseña debe tener al menos 6 caracteres.';
            message.style.color = 'red';
            return;
        }

        try {
            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
            const user = userCredential.user;

            await sendEmailVerification(user);
            await signOut(auth);

            message.textContent = 'Registro exitoso. Se ha enviado un correo de verificación a tu email.';
            message.style.color = 'green';
            form.reset();
        } catch (error) {
            console.error(error);

            let friendlyMessage = 'No se pudo completar el registro.';
            if (error.code === 'auth/email-already-in-use') {
                friendlyMessage = 'Ese correo ya está registrado.';
            } else if (error.code === 'auth/invalid-email') {
                friendlyMessage = 'El correo no es válido.';
            } else if (error.code === 'auth/weak-password') {
                friendlyMessage = 'La contraseña debe tener al menos 6 caracteres.';
            } else if (error.code === 'auth/operation-not-allowed') {
                friendlyMessage = 'El método de correo/contraseña no está habilitado en Firebase Console.';
            }

            message.textContent = friendlyMessage;
            message.style.color = 'red';
        }
    });

    const showPasswordsCheckbox = document.getElementById('show-passwords');
    showPasswordsCheckbox.addEventListener('change', (e) => {
        const pwd = document.getElementById('password');
        const pwdConf = document.getElementById('password-confirm');
        const type = e.target.checked ? 'text' : 'password';
        pwd.type = type;
        pwdConf.type = type;
    });
</script>
{% endblock %}
