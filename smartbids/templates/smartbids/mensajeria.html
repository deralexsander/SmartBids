{% extends 'smartbids/base.html' %}
{% load static %}

{% block nombrePag %}
<title>Mensajería - SmartBids</title>
{% endblock %}

{% block contenido %}
<section class="mensajeria">
    
    <div class="mensajeria__header">
        <h1 class="mensajeria__title">
            Administración de <span>Mensajería y Alertas</span>
        </h1>
    </div>

    <div class="feature-row mensajeria__layout">
        
        <div class="mensajeria__form">

            <form id="form-mensajeria">
                <input type="hidden" id="msg-id" value="">

                <div class="mensajeria__field">
                    <label for="msg-asunto" class="mensajeria__label">
                        Asunto de la alerta:
                    </label>
                    <div class="form-inline mensajeria__input-wrap">
                        <input type="text" id="msg-asunto" placeholder="Ej: Modo de Prueba" required class="mensajeria__input">
                    </div>
                </div>

                <div class="mensajeria__field">
                    <label for="msg-cuerpo" class="mensajeria__label">
                        Mensaje / Detalle:
                    </label>
                    <div class="form-inline mensajeria__input-wrap">
                        <textarea id="msg-cuerpo" rows="4" placeholder="Ingresa el contenido del aviso..." required class="mensajeria__textarea"></textarea>
                    </div>
                </div>

                <div class="stat-grid mensajeria__settings-grid">
                    <div>
                        <label for="msg-estado" class="mensajeria__label">
                            Estado manual:
                        </label>
                        <div class="form-inline mensajeria__input-wrap">
                            <select id="msg-estado" class="mensajeria__select">
                                <option value="activo" selected>Activo (Habilitado)</option>
                                <option value="inactivo">Inactivo (Deshabilitado)</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label for="msg-tipo" class="mensajeria__label">
                            Tipo de alerta:
                        </label>
                        <div class="form-inline mensajeria__input-wrap">
                            <select id="msg-tipo" class="mensajeria__select">
                                <option value="alerta">Alerta (Amarillo / Naranja)</option>
                                <option value="precaucion">Precaución (Rojo)</option>
                                <option value="exito">Éxito (Verde)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="mensajeria__actions">
                    <button type="submit" id="btn-guardar-mensaje" class="btn btn-primary">
                        Guardar Alerta
                    </button>
                    <button type="button" id="btn-cancelar-edicion" class="btn btn-outline">
                        Cancelar
                    </button>
                    <span id="mensaje-status-feedback" class="dash-badge mensajeria__feedback--hidden"></span>
                </div>
            </form>
        </div>

        <div class="mensajeria__alerts-panel">
            <div class="dashboard-header mensajeria__alerts-header">
                <div class="dash-title mensajeria__alerts-title">
                    Alertas Registradas
                </div>
            </div>

            <div id="lista-alertas-admin" class="graphic-mockup mensajeria__alert-list">
                <div class="mockup-item">
                    <div class="mockup-info">
                        <h6>Cargando alertas...</h6>
                        <span>Obteniendo registros del sistema</span>
                    </div>
                    <span class="mockup-status">En espera</span>
                </div>
            </div>
        </div>

    </div>
</section>
{% endblock %}
