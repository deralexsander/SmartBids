{% extends 'smartbids/base.html' %}
{% load static %}

{% block nombrePag %}
<title>Mensajería - SmartBids</title>
{% endblock %}

{% block contenido %}
<section class="value-prop">
    <div class="section-header">
        <br>
        <hr>
        <h2>Administración de Mensajería y Alertas</h2>

        <form id="form-mensajeria" style="margin-top: 15px; text-align: left; max-width: 500px; margin-left: auto; margin-right: auto;">
            <input type="hidden" id="msg-id" value="">

            <div style="margin-bottom: 12px;">
                <label for="msg-asunto"><strong>Asunto de la alerta:</strong></label><br>
                <input type="text" id="msg-asunto" placeholder="Ej: Modo de Prueba" required style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 12px;">
                <label for="msg-cuerpo"><strong>Mensaje / Detalle:</strong></label><br>
                <textarea id="msg-cuerpo" rows="3" placeholder="Ingresa el contenido del aviso..." required style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box;"></textarea>
            </div>

            <div style="margin-bottom: 12px;">
                <label for="msg-estado"><strong>Estado manual del mensaje:</strong></label><br>
                <select id="msg-estado" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box;">
                    <option value="activo" selected>Activo (Habilitado)</option>
                    <option value="inactivo">Inactivo (Deshabilitado)</option>
                </select>
            </div>

            <div style="margin-bottom: 15px;">
                <label for="msg-tipo"><strong>Tipo de alerta:</strong></label><br>
                <select id="msg-tipo" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box;">
                    <option value="alerta">Alerta (Amarillo / Naranja)</option>
                    <option value="precaucion">Precaución (Rojo)</option>
                    <option value="exito">Éxito (Verde)</option>
                </select>
            </div>

            <div style="display: flex; gap: 10px; align-items: center;">
                <button type="submit" id="btn-guardar-mensaje" class="btn btn-primary">
                    Guardar Alerta
                </button>
                <button type="button" id="btn-cancelar-edicion" class="btn" style="display: none; background: #6c757d; color: white;">
                    Cancelar
                </button>
                <span id="mensaje-status-feedback" style="font-weight: bold;"></span>
            </div>
        </form>

        <br>
        <hr>
        
        <h3 style="margin-top: 20px;">Alertas Registradas</h3>
        <div id="lista-alertas-admin" style="max-width: 600px; margin: 15px auto; text-align: left;">
            <p>Cargando alertas...</p>
        </div>

    </div>
</section>
{% endblock %}
