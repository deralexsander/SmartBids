<!DOCTYPE html>
<html class="loading" lang="es">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script type="module" src="{% static 'js/firebase.js' %}"></script>
    <script type="module" src="{% static 'js/functions.js' %}"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="icon" href="{% static '' %}">
    {% block nombrePag %}{% endblock %}
</head>
<body>
    <div id="page-loader" class="page-loader">
        <div class="page-loader-panel">
            <div class="page-loader-bar"></div>
            <div class="page-loader-text">Cargando...</div>
        </div>
    </div>

    <header>
        <a href="{% url 'home' %}" class="logo">
            <div class="logo-icon"><i class="fa-solid fa-chart-line"></i></div>
            <div class="logo-text">Smart<span>Bids</span></div>
        </a>
        <nav>
            {% block nav_links %}{% endblock %}
        </nav>
        <div class="nav-buttons">
            {% block nav_buttons %}
                <a id="btn-login" href="{% url 'ingreso' %}" class="btn btn-outline">Ingresar</a>
                <a id="btn-profile" href="{% url 'perfil' %}" class="btn btn-primary" style="display: none;">Perfil</a>
            {% endblock %}
        </div>
    </header>


    {% block contenido %}{% endblock %}

    <script type="module">
        import { app } from '{% static "js/firebase.js" %}';
        import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';

        const auth = getAuth(app);
        const loginButton = document.getElementById('btn-login');
        const profileButton = document.getElementById('btn-profile');

        const updateNavButtons = (user) => {
            if (loginButton) {
                loginButton.style.display = user ? 'none' : 'inline-flex';
            }
            if (profileButton) {
                profileButton.style.display = user ? 'inline-flex' : 'none';
            }
        };

        onAuthStateChanged(auth, (user) => {
            updateNavButtons(user);
            if (user) {
                console.log('Estado global: usuario autenticado');
                console.log('Correo verificado:', user.emailVerified);
                console.log('Correo del usuario:', user.email);
            } else {
                console.log('Estado global: no hay usuario autenticado');
            }
        });

        window.addEventListener('load', async () => {
            const loader = document.getElementById('page-loader');
            if (!loader) return;

            loader.classList.add('page-loader-done');
            await new Promise((resolve) => setTimeout(resolve, 1000));
            document.documentElement.classList.remove('loading');
            loader.style.opacity = '0';
            setTimeout(() => loader.remove(), 400);
        });
    </script>
</body>
</html>
