<div id="smartbids-cookie-banner" class="cookie-banner" style="display: none;" role="region" aria-label="Aviso de cookies y almacenamiento de datos">
    <div class="cookie-banner__content">
        <div class="cookie-banner__icon">
            <i class="fa-solid fa-cookie-bite"></i>
        </div>
        <div class="cookie-banner__text">
            <p>
                <strong>Privacidad y Cookies:</strong> En SmartBids utilizamos cookies técnicas esenciales y almacenamiento local para mantener tu sesión segura y recordar tus preferencias visuales (modo oscuro) conforme a la <strong>Ley N° 21.719</strong> de Protección de Datos Personales. Conoce más en nuestra <a href="{% url 'informacion' %}#cookies" class="cookie-banner__link">Política de Cookies</a>.
            </p>
        </div>
        <div class="cookie-banner__actions">
            <button id="btn-accept-cookies" type="button" class="btn btn-primary cookie-banner__btn">
                <i class="fa-solid fa-check"></i> Entendido
            </button>
        </div>
    </div>
</div>
